<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="HintForge — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">HintForge — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.72s steps(16) 0.60s forwards" fill="#e5e7eb">pip install -e .</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.62s forwards" fill="#94a3b8">Installing hintforge...</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.84s forwards" fill="#4ade80">Successfully installed hintforge-0.1.0</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.41s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.41s forwards,type 1.40s steps(31) 2.41s forwards" fill="#e5e7eb">hintforge analyze protected.zip</text>
<text x="50" y="204" class="l" style="animation:show .01s 4.11s forwards" fill="#94a3b8">FILE: protected.zip</text>
<text x="50" y="230" class="l" style="animation:show .01s 4.33s forwards" fill="#94a3b8">FORMAT: ZIP (AES-256)</text>
<text x="50" y="256" class="l" style="animation:show .01s 4.55s forwards" fill="#94a3b8">ATTACK RECOMMENDED: AI-hybrid</text>
<text x="50" y="282" class="l" style="animation:show .01s 4.77s forwards" fill="#94a3b8">EST. BRUTE TIME: 400 years</text>
<text x="28" y="334" class="l" style="animation:show .01s 5.34s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="334" class="l ty" style="animation:show .01s 5.34s forwards,type 2.20s steps(75) 5.34s forwards" fill="#e5e7eb">hintforge recover protected.zip --hint &apos;my old car civic and the year 2009&apos;</text>
<text x="50" y="360" class="l" style="animation:show .01s 7.84s forwards" fill="#94a3b8">Querying local LLM...</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.06s forwards" fill="#94a3b8">Generated 38 candidates (top: civic2009!)</text>
<text x="50" y="412" class="l" style="animation:show .01s 8.28s forwards" fill="#94a3b8">[█████] Testing... Success in 4s</text>
<text x="50" y="438" class="l" style="animation:show .01s 8.50s forwards" fill="#94a3b8">PASSWORD FOUND: civic2009!</text>
<text x="28" y="490" class="l" style="animation:show .01s 9.07s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 9.07s forwards,type 2.20s steps(68) 9.07s forwards" fill="#e5e7eb">hintforge generate --context &apos;family trip to berlin 2017&apos; --count 50</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.57s forwards" fill="#94a3b8">Created 50 high-likelihood passwords</text>
<g class="l" style="animation:show .01s 11.79s forwards"><text x="28" y="542" fill="#00ff9f">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
